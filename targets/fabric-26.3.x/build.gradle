plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java-library'
    id 'maven-publish'
}
version = mod_version
group = mod_group_id
base { archivesName = "LivingWind-Fabric-${minecraft_display_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Optional: Mod Menu is not required to use Living Wind or the F8 config screen.
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}
sourceSets {
    main {
        java.srcDir file('../../shared/26x/26.3/java')
        resources.srcDir file('../../shared/26x/resources')
    }
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'loader_version', loader_version
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'minecraft_version_range': minecraft_version_range, 'loader_version': loader_version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(25) }
// Minecraft is unobfuscated; the normal jar is the release artifact.
tasks.named('jar') { archiveFileName = "LivingWind-Fabric-${minecraft_display_version}-v${mod_version}.jar" }

// Migration diagnostics: avoid javac truncating cascading API errors at 100.
tasks.withType(JavaCompile).configureEach { options.compilerArgs.addAll(["-Xmaxerrs", "1000", "-Xdiags:verbose"]) }
