plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}
// Optional Sable physics integration: compile against its API only, never bundle it.
// Maven coordinates match the Sable API used by AeroWeather's tested integration.
repositories {
    exclusiveContent {
        forRepository {
            maven { name = 'ModrinthSable'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { name = 'SableCompanion'; url = 'https://maven.ryanhcode.dev/releases' }
}
dependencies {
    compileOnly 'maven.modrinth:sable:U678xqle'
    compileOnly 'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'
}

version = mod_version
group = mod_group_id
base { archivesName = "LivingWind-NeoForge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Shared, byte-identical Living Wind sources/resources used by both maintained targets.
sourceSets {
    main {
        java.srcDir file('../../shared/common/java')
        resources.srcDir file('../../shared/common/resources')
    }
}
neoForge {
    // Compiles against the non-recompiled Minecraft artifacts rather than
    // decompiling and recompiling the entire game for each new workspace.
    // This affects only the development toolchain, not the final mod code.
    enable {
        version = project.neo_version
        disableRecompilation = true
    }
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    archiveFileName = "LivingWind-NeoForge-${minecraft_version}-v${mod_version}.jar"
}
idea { module { downloadSources = true; downloadJavadoc = true } }
